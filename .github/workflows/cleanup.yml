name: Clean up expired tables

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/cleanup-tables.mjs
        env:
          FIREBASE_CLEANUP_KEY: ${{ secrets.FIREBASE_CLEANUP_KEY }}
      # GitHub switches off scheduled workflows after 60 days without commits; re-enabling resets that clock.
      - name: Keep this schedule alive
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/cleanup.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
